<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Proxity</title>
    <style>
        /* [Tus estilos CSS existentes se mantienen igual] */
    </style>
</head>
<body>
    <!-- Menú (cargado dinámicamente) -->
    <div id="navbar"></div>

    <!-- Contenido principal -->
    <div class="container">
        <h1>Contáctenos</h1>
        <p>Complete el formulario o utilice nuestros canales directos.</p>
        
        <!-- Formulario Netlify CORREGIDO -->
        <div class="contact-form">
            <form id="form" name="contact" method="POST" netlify>
                <!-- Campo oculto CRÍTICO para Netlify Forms -->
                <input type="hidden" name="form-name" value="contact">
                
                <!-- Campo honeypot opcional para spam -->
                <div style="display: none;">
                    <label>No llenar este campo: <input name="bot-field"></label>
                </div>
                
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="service">Servicio de interés</label>
                    <select id="service" name="service">
                        <option value="">Seleccione una opción</option>
                        <option value="workflow">Workflow Pro</option>
                        <option value="docustream">DocuStream</option>
                        <option value="rpa">Hiperautomatización/RPA</option>
                        <option value="development">Desarrollo a medida</option>
                        <option value="support">Soporte técnico</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">Enviar mensaje</button>
            </form>
        </div>
        
        <!-- [El resto de tu contenido se mantiene igual] -->
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Carga el menú
        $(function(){
            $("#navbar").load("includes/navbar.html");
        });
    </script>
    <!-- Iconos de Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
