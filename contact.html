<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Proxity</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
            color: #333;
        }
        .container {
            width: 85%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 0;
        }
        
        /* Estilos del formulario */
        .contact-form {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button[type="submit"] {
            background: #0066cc;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button[type="submit"]:hover {
            background: #0055aa;
        }
        
        /* Sección de contacto alternativo */
        .contact-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .contact-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .contact-card h3 {
            color: #0066cc;
        }
        .whatsapp-btn {
            background: #25D366;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .email-link {
            color: #0066cc;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Menú (cargado dinámicamente) -->
    <div id="navbar"></div>

    <!-- Contenido principal -->
    <div class="container">
        <h1>Contáctenos</h1>
        <p>Complete el formulario o utilice nuestros canales directos.</p>
        
        <!-- Formulario Netlify -->
        <div class="contact-form">
            <form id="form" name="contact" method="POST" netlify>
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="service">Servicio de interés</label>
                    <select id="service" name="service">
                        <option value="">Seleccione una opción</option>
                        <option value="workflow">Workflow Pro</option>
                        <option value="docustream">DocuStream</option>
                        <option value="rpa">Hiperautomatización/RPA</option>
                        <option value="development">Desarrollo a medida</option>
                        <option value="support">Soporte técnico</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">Enviar mensaje</button>
            </form>
        </div>
        
        <!-- Opciones alternativas de contacto -->
        <div class="contact-options">
            <div class="contact-card">
                <h3>Correo electrónico</h3>
                <p>Escríbanos directamente a:</p>
                <a href="mailto:contacto@proxity.com.co" class="email-link">contacto@proxity.com.co</a>
            </div>
            
            <div class="contact-card">
                <h3>WhatsApp</h3>
                <p>Para consultas inmediatas:</p>
                <a href="https://wa.me/573001234567?text=Hola%20Proxity,%20quisiera%20más%20información" class="whatsapp-btn">
                    <i class="fab fa-whatsapp"></i> Chatear ahora
                </a>
                <p style="margin-top: 10px; font-size: 0.9em;">+57 311 2977029</p>
            </div>
            
            <div class="contact-card">
                <h3>Redes sociales</h3>
                <p>Síganos para novedades:</p>
                <div style="margin-top: 15px;">
                    <a href="#" style="margin: 0 10px; color: #0066cc;"><i class="fab fa-linkedin"></i></a>
                    <a href="#" style="margin: 0 10px; color: #0066cc;"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Carga el menú
        $(function(){
            $("#navbar").load("includes/navbar.html");
        });
    </script>
    <!-- Iconos de Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
