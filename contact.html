<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto | Proxity</title>
</head>
<body>
    <!-- Mismo menú -->

    <section class="container" style="padding: 50px 0;">
        <h1>Contáctenos</h1>
        
        <form id="form" netlify style="max-width: 500px; margin: 0 auto;">
            <input type="text" name="name" placeholder="Nombre" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Mensaje" rows="5" required></textarea>
            <button type="submit" class="btn">Enviar</button>
        </form>
    </section>
</body>
</html>
